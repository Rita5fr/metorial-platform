version: '3.9'

services:
  etcd:
    image: 'bitnamilegacy/etcd:latest'
    ports:
      - '32379:2379'
      - '32380:2380'
    environment:
      - ALLOW_NONE_AUTHENTICATION=yes
    restart: unless-stopped

  mongodb:
    image: 'mongo:latest'
    ports:
      - '32707:27017'
    volumes:
      - './_volumes/mongodb:/data/db'
    restart: unless-stopped
    environment:
      - MONGO_INITDB_ROOT_USERNAME=mongo
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD}

  redis-db:
    image: 'redis:latest'
    ports:
      - '36379:6379'
    volumes:
      - './_volumes/redis:/data'
    restart: unless-stopped

  meilisearch:
    image: 'getmeili/meilisearch:v1.14'
    ports:
      - '37700:7700'
    volumes:
      - './_volumes/meilisearch:/meili_data'
    environment:
      - MEILI_ENV=development
    restart: unless-stopped

  postgres-db:
    image: 'postgres:latest'
    ports:
      - '35432:5432'
    volumes:
      - './_volumes/postgres:/var/lib/postgresql/data'
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=postgres
    command: "postgres -c 'max_connections=1000'"
    restart: unless-stopped

  minio:
    image: 'minio/minio:latest'
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - './_volumes/minio:/data'
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    command: 'server --console-address ":9001" /data'
    restart: unless-stopped

  opensearch:
    image: 'opensearchproject/opensearch:2.9.0'
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - 'OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m'
      - plugins.security.disabled=false
      - plugins.security.allow_default_init_securityindex=true
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_ADMIN_PASSWORD}
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - '9200:9200'
      - '9600:9600'
    volumes:
      - './_volumes/opensearch:/usr/share/opensearch/data'
    restart: unless-stopped

  opensearch-dashboards:
    image: 'opensearchproject/opensearch-dashboards:2.9.0'
    ports:
      - '5601:5601'
    environment:
      - 'OPENSEARCH_HOSTS=https://opensearch:9200'
      - OPENSEARCH_USERNAME=admin
      - OPENSEARCH_PASSWORD=${OPENSEARCH_ADMIN_PASSWORD}
      - OPENSEARCH_SSL_VERIFICATIONMODE=none
      - SERVER_SSL_ENABLED=false
    depends_on:
      - opensearch
    restart: unless-stopped

  api:
    build:
      context: ../../
      dockerfile: deployment/dockerfiles/api.Dockerfile
    environment:
      - 'EMAIL_SES_ACCESS_KEY_ID=${EMAIL_SES_ACCESS_KEY_ID}'
      - 'EMAIL_SES_SECRET_ACCESS_KEY=${EMAIL_SES_SECRET_ACCESS_KEY}'
      - 'EMAIL_SES_REGION=${EMAIL_SES_REGION}'
      - EMAIL_FROM=Metorial
      - 'EMAIL_FROM_NAME=${EMAIL_FROM_NAME}'
      - 'DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@postgres-db:5432/postgres'
      - 'REDIS_URL=redis://:@redis-db:6379'
      - 'USAGE_MONGO_URL=mongodb://mongo:${MONGO_PASSWORD}@mongodb:27017'
      - 'CODE_WORKSPACE_SERVICE_ADDRESS=http://code-workspace:3000'
      - 'OPENSEARCH_HOST=https://opensearch:9200'
      - OPENSEARCH_USERNAME=admin
      - OPENSEARCH_PASSWORD=${OPENSEARCH_ADMIN_PASSWORD}
      - 'PROVIDER_OAUTH_TICKET_SECRET=${SECRET}'
      - 'AUTH_TICKET_SECRET=${SECRET}'
      - 'ENCRYPTION_SECRET=${SECRET}'
      - 'API_URL=${HOST}:4310'
      - 'APP_URL=${HOST}:4300'
      - 'MCP_URL=${HOST}:4311'
      - 'PROVIDER_OAUTH_URL=${HOST}:4313'
      - 'PORTALS_URL=${HOST}:4315'
      - 'INTEGRATIONS_API_URL=${HOST}:4316'
      - DENO_DEPLOY_TOKEN=placeholder
      - DENO_ORGANIZATION_ID=placeholder
      - SCM_GITHUB_CLIENT_ID=placeholder
      - SCM_GITHUB_CLIENT_SECRET=placeholder
      - METORIAL_ENV=production
      - NODE_ENV=production
    ports:
      - '4310:4310'
      - '4311:4311'
      - '4312:4312'
      - '4313:4313'
      - '4314:4314'
      - '4315:4315'
      - '4321:4321'
      - '4316:4316'
    depends_on:
      - postgres-db
      - redis-db
      - mongodb
      - meilisearch
      - etcd
      - opensearch
    restart: unless-stopped

  engine:
    build:
      context: ../../
      dockerfile: deployment/dockerfiles/engine.Dockerfile
    ports:
      - '50050:50050'
    depends_on:
      - postgres-db
      - redis-db
    environment:
      - 'REDIS_ENDPOINTS=redis://:@redis-db:6379'
      - 'ENGINE_DATABASE_DSN=host=postgres-db user=postgres password=${POSTGRES_PASSWORD} dbname=engine port=5432 sslmode=disable'
      - 'ENGINE_MANAGER_ADDRESSES=localhost:50050'
      - ENABLE_RESOURCE_CHECK=false
    restart: unless-stopped

  frontend:
    build:
      context: ../../
      dockerfile: deployment/dockerfiles/frontend.Dockerfile
    ports:
      - '3300:3000'
    depends_on:
      - postgres-db
      - redis-db
    environment:
      - PORT=3000
      - VITE_METORIAL_ENV=production
      - METORIAL_ENV=production
      - 'VITE_EXPLORER_URL=https://explorer.metorial.com'
      - 'VITE_MCP_API_URL=${HOST}:4311'
      - 'VITE_CORE_API_URL=${HOST}:4310'
      - 'VITE_PRIVATE_API_URL=${HOST}:4314'
      - 'VITE_CODE_EDITOR_URL=${HOST}:3000'
      - 'VITE_CODE_BUCKET_API_URL=${HOST}:3000'
      - 'VITE_MARKETPLACE_API_URL=${HOST}:4312'
      - 'VITE_DASHBOARD_FRONTEND_URL=${HOST}:4300'
      - 'VITE_DOCS_FRONTEND_URL=https://metorial.com/docs'
      - 'VITE_API_DOCS_FRONTEND_URL=https://metorial.com/api'
      - 'VITE_PUBLIC_API_URL=${HOST}:4310'
    restart: unless-stopped
